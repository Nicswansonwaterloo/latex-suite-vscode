name: Extension checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: ['1.137.0', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test scripts/check-release.test.js
      - run: npm run test:unit
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- --code-version ${{ matrix.vscode }}
      - if: runner.os != 'Linux'
        run: npm test -- --code-version ${{ matrix.vscode }}
      - run: npm run package:vsix
      - run: npm run check:package
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vsix
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:trust
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
